name: Validate template
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install test dependencies (as setup.sh installs them)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy jupyter-server "transformers==4.57.3" "accelerate==1.12.0" \
            librosa soundfile sox onnxruntime einops
          python -m pip install --no-deps "qwen-tts==0.1.1"
      - name: Check shell and Python syntax
        run: |
          bash -n setup.sh
          bash -n bootstrap.sh
          python -m compileall -q custom_nodes tools
      - name: Workflows match the builder and the node schemas
        run: |
          python tools/build_workflow.py
          git diff --exit-code workflows
          python -B tools/test_workflows.py
      - name: Engine (script parts, pauses, clone prompt, voice pool, audio files)
        run: python -B tools/test_engine.py
      - name: Qwen3-TTS model and package still match the engine
        run: python -B tools/test_upstream.py
      - name: Storage and download regression tests
        run: |
          python -B tools/test_storage.py
          python -B tools/test_setup.py
      - name: Jupyter and setup integration tests
        run: |
          python -B tools/test_jupyter.py
          python -B tools/test_boot.py
